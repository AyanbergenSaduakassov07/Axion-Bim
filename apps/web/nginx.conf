server {
    listen 80;
    server_name _;

    # Keep this aligned with AXIOM_MAX_UPLOAD_MB's default in the API.
    client_max_body_size 500M;

    # Same-origin only. web-ifc compiles wasm ('wasm-unsafe-eval'); fragments may spawn blob: workers;
    # inline styles come from React style props and the printable report's <style>. No inline scripts.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Serve static assets
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # nginx's mime.types has no .mjs: served as octet-stream + nosniff, the fragments module worker is refused
    location ~ \.mjs$ {
        root /usr/share/nginx/html;
        default_type text/javascript;
    }

    # Proxy API requests to FastAPI backend
    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
