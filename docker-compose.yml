services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - AXIOM_DATA_DIR=/data
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - AXIOM_COPILOT_MODEL=${AXIOM_COPILOT_MODEL:-}
    volumes:
      - axiom-data:/data
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  axiom-data:
